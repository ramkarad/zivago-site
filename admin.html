<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | FreshSip</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="admin-page">

  <header class="header">
    <a href="index.html" class="logo">🍊 Ziva<span>Go</span></a>
    <a href="index.html" class="continue-link">← Back to Website</a>
  </header>

  <main class="admin-container">

    <div id="login-box" class="admin-card login-card">
      <h1>Admin Login</h1>
      <p>Login to manage your juice products.</p>

      <form id="login-form">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>

        <button type="submit" class="btn full-btn">Login</button>
        <p id="login-error" class="error-message"></p>
      </form>
    </div>

    <div id="dashboard" hidden>
      <div class="admin-heading">
        <div>
          <span class="tag">ADMIN DASHBOARD</span>
          <h1>Manage Products</h1>
          <p>Add and manage your juice products.</p>
        </div>
        <button class="logout-btn" onclick="adminLogout()">Logout</button>
      </div>

      <div class="admin-card">
        <h2>Add New Product</h2>

        <form id="product-form">
          <label>Product Name</label>
          <input type="text" id="product-name" placeholder="e.g. Fresh Orange Juice" required>

          <label>Product Image</label>
          <input type="file" id="product-image" accept="image/*" required>
          <img id="image-preview" class="image-preview" alt="Image preview" hidden>

          <label>Product Price (₹)</label>
          <input type="number" id="product-price" placeholder="Enter price" min="1" step="0.01" required>

          <label>Product Description</label>
          <textarea id="product-description" placeholder="Enter product description" rows="4" required></textarea>

          <button type="submit" class="btn full-btn">Save Product</button>
          <p id="save-message" class="success-message"></p>
        </form>
      </div>

      <div class="admin-card">
        <h2>All Products (<span id="admin-product-count">0</span>)</h2>
        <div id="admin-products" class="admin-products"></div>
      </div>
    </div>

  </main>

  <script src="admin.js"></script>
</body>

</html>
